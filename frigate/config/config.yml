# Frigate configuration — bear watch on the wooded hill.
# Reference: https://docs.frigate.video/configuration/reference

mqtt:
  enabled: true
  host: mosquitto
  topic_prefix: frigate

# --- Detector ---------------------------------------------------------------
# Case A (Intel iGPU): OpenVINO on the GPU. Case C (no GPU): device: CPU.
# Case B (DVA3221/NVIDIA + tensorrt image): replace with
#   detectors:
#     tensorrt:
#       type: tensorrt
detectors:
  ov:
    type: openvino
    device: GPU

# Default model bundled in the image. COCO-trained: knows `bear` natively.
# Upgrading to Frigate+ later is just: model: { path: plus://<your-model-id> }
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Hardware video decode on the Intel iGPU. Remove for CPU-only (Case C);
# use preset-nvidia for Case B.
ffmpeg:
  hwaccel_args: preset-vaapi

# --- Camera sources ---------------------------------------------------------
# go2rtc restreams each camera once, so Frigate's detect/record roles (and
# optionally Surveillance Station) don't open multiple connections per camera.
# Replace IPs and paths with your cameras'. The examples are Dahua/Loryta-style;
# Hikvision main/sub paths look like /Streaming/Channels/101 and /102.
go2rtc:
  streams:
    hillside: # main stream: high-res, used for recording
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.51:554/cam/realmonitor?channel=1&subtype=0
    hillside_sub: # substream: low-res, used for detection
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.51:554/cam/realmonitor?channel=1&subtype=1
    # Second camera (optional) — different angle on the same hill:
    # hillside_east:
    #   - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.52:554/cam/realmonitor?channel=1&subtype=0
    # hillside_east_sub:
    #   - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.52:554/cam/realmonitor?channel=1&subtype=1
    # Battery Tapo camera (C403 etc.): proprietary TP-Link protocol, no RTSP.
    # Uses your Tapo CLOUD password (connection itself stays on the LAN).
    # Only streams while the tapo-bridge wakes it — see README "Battery cameras".
    # hillside_tapo:
    #   - tapo://{FRIGATE_TAPO_CLOUD_PASSWORD}@192.168.1.60

cameras:
  hillside:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/hillside_sub
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/hillside
          input_args: preset-rtsp-restream
          roles: [record]

    # Match your camera's substream. 5 fps is the sweet spot for detection —
    # higher wastes GPU without catching more bears.
    detect:
      width: 1280
      height: 720
      fps: 5

    objects:
      track:
        - bear
        - dog # ┐
        - cat # ├ bear proxies: the COCO model sometimes mislabels bears.
        - cow # ┘  The notifier only alerts on these if they're bear-sized.
        - person # nice to know who's walking up the hill
      filters:
        bear:
          # Low entry score on purpose: COCO bear confidence runs ~0.5 on real
          # footage. The zone + area filters keep false positives in check.
          min_score: 0.40
          threshold: 0.55
          min_area: 4000 # ignore squirrel-sized blobs (px² at 1280x720)
          max_area: 500000
        person:
          min_score: 0.5
          threshold: 0.7

    # Paint out perpetually-moving foliage (treetops) in the UI:
    # Settings -> Motion Masks. The UI saves coordinates back to this file.
    # motion:
    #   mask:
    #     - 0.0,0.0,1.0,0.0,1.0,0.15,0.0,0.15   # example: top 15% = swaying canopy

    # Draw the actual hill polygon in the UI (Settings -> Zones); this
    # placeholder covers the upper 2/3 of frame.
    zones:
      wooded_hill:
        coordinates: 0.0,0.0,1.0,0.0,1.0,0.66,0.0,0.66
        objects: [bear, dog, cat, cow, person]

    review:
      alerts:
        labels: [bear]
        required_zones: [wooded_hill]
      detections:
        labels: [dog, cat, cow, person]

    snapshots:
      enabled: true
      retain:
        default: 30

    record:
      enabled: true
      retain:
        days: 3 # continuous recording buffer
        mode: motion
      alerts:
        retain:
          days: 30 # keep bear clips a month
      detections:
        retain:
          days: 14
      # To cut disk write load in half (e.g. if Surveillance Station also
      # records 24/7), set retain.days: 0 to keep only alert/detection clips.

  # hillside_east:  # uncomment and mirror the block above for camera #2

  # --- Battery Tapo camera (wake-on-motion, used with the tapo-bridge) -------
  # `enabled: true` is required: Frigate rejects the bridge's MQTT wake
  # command for cameras disabled in config. The bridge puts it to sleep on
  # startup and only wakes it during PIR-triggered windows.
  # hillside_tapo:
  #   enabled: true
  #   ffmpeg:
  #     inputs:
  #       - path: rtsp://127.0.0.1:8554/hillside_tapo
  #         input_args: preset-rtsp-restream
  #         roles: [detect, record]
  #   detect:
  #     width: 1280
  #     height: 720
  #     fps: 5
  #   objects:
  #     track: [bear, dog, cat, cow, person]
  #     filters:
  #       bear:
  #         min_score: 0.40
  #         threshold: 0.55
  #         min_area: 4000
  #   # Same zone name as the main camera so the bear-notifier's
  #   # REQUIRED_ZONES filter matches; covers the full frame by default.
  #   zones:
  #     wooded_hill:
  #       coordinates: 0.0,0.0,1.0,0.0,1.0,1.0,0.0,1.0
  #       objects: [bear, dog, cat, cow, person]
  #   review:
  #     alerts:
  #       labels: [bear]
  #       required_zones: [wooded_hill]
  #   snapshots:
  #     enabled: true
  #   record:
  #     enabled: true
  #     retain:
  #       days: 0          # camera only streams during motion windows anyway
  #     alerts:
  #       retain:
  #         days: 30

# Native Frigate web-push notifications (alternative to the ntfy bridge).
# Requires HTTPS access to the UI; register devices under Settings -> Notifications.
notifications:
  enabled: false
  # email: you@example.com
