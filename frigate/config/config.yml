# Frigate configuration — bear watch via a battery Tapo camera (C403).
# Reference: https://docs.frigate.video/configuration/reference

mqtt:
  enabled: true
  host: mosquitto
  topic_prefix: frigate

# --- Detector ---------------------------------------------------------------
# Case A (Intel iGPU): OpenVINO on the GPU. Case C (no GPU): device: CPU.
# Case B (DVA3221/NVIDIA + tensorrt image): replace with
#   detectors:
#     tensorrt:
#       type: tensorrt
detectors:
  ov:
    type: openvino
    device: GPU

# Default model bundled in the image. COCO-trained: knows `bear` natively.
# Upgrading to Frigate+ later is just: model: { path: plus://<your-model-id> }
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Hardware video decode on the Intel iGPU. Remove for CPU-only (Case C);
# use preset-nvidia for Case B.
ffmpeg:
  hwaccel_args: preset-vaapi

# --- Camera source ----------------------------------------------------------
# Battery Tapo cameras (C403 etc.) have no RTSP — go2rtc speaks TP-Link's
# proprietary protocol instead. Uses your Tapo CLOUD password (the connection
# itself stays on the LAN). Replace the IP with your camera's.
# The camera only streams while the tapo-bridge wakes it (see README).
go2rtc:
  streams:
    hillside_tapo:
      - tapo://{FRIGATE_TAPO_CLOUD_PASSWORD}@192.168.1.60

cameras:
  hillside_tapo:
    # Must stay `enabled: true`: Frigate rejects the tapo-bridge's MQTT wake
    # command for cameras disabled in config. The bridge puts the camera to
    # sleep on startup and only wakes it during PIR-triggered windows.
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/hillside_tapo
          input_args: preset-rtsp-restream
          roles: [detect, record]

    # 5 fps is the sweet spot for detection — higher wastes GPU (and camera
    # battery) without catching more bears.
    detect:
      width: 1280
      height: 720
      fps: 5

    objects:
      track:
        - bear
        - dog # ┐
        - cat # ├ bear proxies: the COCO model sometimes mislabels bears.
        - cow # ┘  The notifier only alerts on these if they're bear-sized.
        - person # nice to know who's walking up the hill
      filters:
        bear:
          # Low entry score on purpose: COCO bear confidence runs ~0.5 on real
          # footage. The zone + area filters keep false positives in check.
          min_score: 0.40
          threshold: 0.55
          min_area: 4000 # ignore squirrel-sized blobs (px² at 1280x720)
          max_area: 500000
        person:
          min_score: 0.5
          threshold: 0.7

    # Covers the full frame by default; redraw over the actual hill in the UI
    # (Settings -> Zones) once the camera is mounted. Keep the name — the
    # bear-notifier's REQUIRED_ZONES filter matches on it.
    zones:
      wooded_hill:
        coordinates: 0.0,0.0,1.0,0.0,1.0,1.0,0.0,1.0
        objects: [bear, dog, cat, cow, person]

    review:
      alerts:
        labels: [bear]
        required_zones: [wooded_hill]
      detections:
        labels: [dog, cat, cow, person]

    snapshots:
      enabled: true
      retain:
        default: 30

    record:
      enabled: true
      retain:
        days: 0 # camera only streams during motion windows anyway
      alerts:
        retain:
          days: 30 # keep bear clips a month
      detections:
        retain:
          days: 14

# Native Frigate web-push notifications (alternative to the ntfy bridge).
# Requires HTTPS access to the UI; register devices under Settings -> Notifications.
notifications:
  enabled: false
  # email: you@example.com
